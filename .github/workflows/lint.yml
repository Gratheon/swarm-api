name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # New advisories land without code changes, so rescan weekly.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golangci-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          # Existing findings are being cleaned up separately; fail only on new ones.
          only-new-issues: true

  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Not go-version-file: go.mod says 1.26.0, and govulncheck reports
      # standard library vulnerabilities for the Go it runs with.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true
          cache: true

      # Text output only: it exits 3 when vulnerable code is reachable.
      # -json and -format sarif always exit 0.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
