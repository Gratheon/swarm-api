name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test and Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: swarm_api
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d swarm_api"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      TESTING: "true"
      TEST_DB_DSN: "postgres://test:test@127.0.0.1:5432/swarm_api?sslmode=disable&connect_timeout=5"
      MIGRATE_DB_DSN: "postgres://test:test@127.0.0.1:5432/swarm_api?sslmode=disable"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests with coverage
        run: |
          go test -v -covermode=atomic -coverprofile=coverage-unit.raw.out ./...
          grep -v "^github.com/Gratheon/swarm-api/graph/generated/generated.go:" coverage-unit.raw.out > coverage-unit.out
          rm -f coverage-unit.raw.out

      - name: Run DB migrations for integration tests
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@latest
          "$(go env GOPATH)/bin/goose" -dir migrations postgres "$MIGRATE_DB_DSN" up

      - name: Run integration tests with coverage
        run: |
          go test -v -tags=integration -covermode=atomic -coverprofile=graph/coverage-integration.raw.out ./graph
          grep -v "^github.com/Gratheon/swarm-api/graph/generated/generated.go:" graph/coverage-integration.raw.out > graph/coverage-integration.out
          rm -f graph/coverage-integration.raw.out

      - name: Upload unit coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-unit.out
          flags: unittests
          disable_search: true
          verbose: true
          fail_ci_if_error: false

      - name: Upload integration coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./graph/coverage-integration.out
          flags: integration
          disable_search: true
          verbose: true
          fail_ci_if_error: false
