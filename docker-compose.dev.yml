version: '3.9'
services:
  swarm-api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    tty: true
    environment:
      ENV_ID: dev
      SERVICE_NAME: swarm-api
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4318}
      OTEL_SERVICE_NAME: swarm-api
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=dev,service.namespace=gratheon
      HYPERDX_API_KEY: ${HYPERDX_API_KEY:-local-gratheon-clickstack}
    ports:
      - 8100:8100
    volumes:
      - ./:/app
    networks:
      - gratheon_default

networks:
  gratheon_default:
    external: true
